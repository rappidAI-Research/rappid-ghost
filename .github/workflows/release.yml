name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (for example v0.2.0)
        required: true
        type: string
  push:
    branches:
      - "release/v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              test "$GITHUB_REF" = refs/heads/main
              release_tag="$INPUT_TAG"
              ;;
            push)
              case "$GITHUB_REF" in
                refs/heads/release/v*) release_tag="${GITHUB_REF#refs/heads/release/}" ;;
                *) exit 1 ;;
              esac
              ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "$release_tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.0
          cache: true
      - name: Verify release source
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if test "$GITHUB_EVENT_NAME" = push; then
            test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          fi
          test -f "docs/releases/$RELEASE_TAG.md"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git cat-file -t "$RELEASE_TAG")" = tag
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
      - name: Verify source and security gate
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go mod tidy -diff
          go vet ./...
          go test ./...
          go test -race ./...
          docker info
          GHOST_DOCKER_INTEGRATION=1 go test ./internal/bench ./internal/runtime ./internal/session -run Docker -v
          go build -o bin/ghost ./cmd/ghost
          ./bin/ghost bench --require-all --json
      - name: Build and verify release artifacts
        run: |
          make dist VERSION="${RELEASE_TAG#v}"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Create or verify annotated release tag
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$RELEASE_TAG" --message "Ghost $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git describe --exact-match --match "$RELEASE_TAG" HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Ghost $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
