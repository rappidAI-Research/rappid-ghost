name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Audited release version (for example v0.3.0)
        required: true
        type: string
  push:
    branches:
      - "release/v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              test "$GITHUB_REF" = refs/heads/main
              release_tag="$INPUT_TAG"
              ;;
            push)
              case "$GITHUB_REF" in
                refs/heads/release/v*) release_tag="${GITHUB_REF#refs/heads/release/}" ;;
                *) exit 1 ;;
              esac
              ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "$release_tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.8
          cache: true
      - name: Verify release source
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if test "$GITHUB_EVENT_NAME" = push; then
            test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          fi
          test -f "docs/releases/$RELEASE_TAG.md"
          grep -Fq "## $RELEASE_TAG — " CHANGELOG.md
          test "$(go run ./cmd/ghost version)" = "ghost ${RELEASE_TAG#v}"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git cat-file -t "$RELEASE_TAG")" = tag
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
      - name: Require successful CI for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_ci=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$(git rev-parse HEAD)" -f branch=main -f event=push --jq '.workflow_runs[0].id')
          test -n "$main_ci" && test "$main_ci" != null
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$main_ci" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$main_ci/jobs" --jq '[.jobs[] | select(.name == "go" or .name == "docker-integration")] | length == 2 and all(.conclusion == "success")')" = true
      - name: Verify source and security gate
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go mod tidy -diff
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          go test ./...
          go test -race ./...
          docker info
          set -o pipefail
          GHOST_DOCKER_INTEGRATION=1 go test ./internal/bench ./internal/runtime ./internal/session ./internal/cli -run Docker -count=1 -json | tee docker-integration.jsonl
          if grep -q '"Action":"skip"' docker-integration.jsonl; then
            echo "Required Docker integration tests must not skip"
            exit 1
          fi
          go build -o bin/ghost ./cmd/ghost
          make build
          ./bin/ghost bench
          ./bin/ghost bench --json
          ./bin/ghost bench --require-all --json
          GHOST_DOCKER_INTEGRATION=1 go test ./internal/runtime -run '^TestDockerResourceChildOOMHasDaemonEvidence$' -count=10
      - name: Verify normal user workflow
        run: |
          ghost_bin="$PWD/bin/ghost"
          project_dir="$(mktemp -d)"
          cd "$project_dir"
          git init --quiet
          "$ghost_bin" init
          "$ghost_bin" init
          test "$(grep -Fxc '.ghost/' .gitignore)" = 1
          python3 -c 'import shutil; shutil.rmtree(".ghost")'
          "$ghost_bin" run sh -c 'printf "safe build output\n" > generated.txt'
          test -s generated.txt
          "$ghost_bin" run -- sh -c 'printf "legacy syntax works\n" > legacy.txt'
          test -s legacy.txt
          "$ghost_bin" inspect
          "$ghost_bin" graph --json
          "$ghost_bin" incidents --json
      - name: Build and verify release artifacts
        run: |
          make dist VERSION="${RELEASE_TAG#v}"
          test "$(./dist/ghost_${RELEASE_TAG#v}_linux_amd64 version)" = "ghost ${RELEASE_TAG#v}"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Create or verify annotated release tag
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$RELEASE_TAG" --message "Ghost $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git describe --exact-match --match "$RELEASE_TAG" HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Ghost $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
