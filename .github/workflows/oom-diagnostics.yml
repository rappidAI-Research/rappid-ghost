name: OOM diagnosis
on:
  push:
    branches: [codex/oom-evidence-fix]
permissions:
  contents: read
jobs:
  independent-kernel-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.8
      - name: Capture kernel counters with the unchanged Ghost execution path
        env:
          GHOST_DOCKER_INTEGRATION: "1"
          GHOST_OOM_DIAG_CGROUP: /sys/fs/cgroup/system.slice
        run: |
          sudo timeout 240 ctr --namespace moby events > /tmp/ghost-containerd-events.log &
          events_pid=$!
          trap 'sudo kill "$events_pid" 2>/dev/null || true' EXIT
          go test ./internal/runtime -run '^TestDockerResourceChildOOMHasDaemonEvidence$' -count=100 -v
