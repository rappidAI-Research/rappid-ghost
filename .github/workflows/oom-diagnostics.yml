name: OOM regression
on:
  push:
    branches: [codex/oom-evidence-fix]
permissions:
  contents: read
jobs:
  independent-kernel-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.8
      - name: Repeat strict child OOM regression on the stock Docker runtime
        env:
          GHOST_DOCKER_INTEGRATION: "1"
        run: go test ./internal/runtime -run '^TestDockerResourceChildOOMHasDaemonEvidence$' -count=100 -v
