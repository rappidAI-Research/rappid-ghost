name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          check-latest: true
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build CLI
        run: go build ./cmd/ghost

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          check-latest: true
          cache: true
      - name: Verify Docker
        run: docker info
      - name: Test Docker isolation, Shadow evidence, and network boundary
        env:
          GHOST_DOCKER_INTEGRATION: "1"
        run: go test ./internal/bench ./internal/runtime ./internal/session -run Docker -v
      - name: Run complete GhostBench release gate
        run: |
          go build -o bin/ghost ./cmd/ghost
          ./bin/ghost bench --require-all --json
