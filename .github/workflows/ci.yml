name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.8
          cache: true
      - name: Verify module integrity
        run: |
          go mod verify
          go mod tidy -diff
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Build CLI
        run: |
          go build ./cmd/ghost
          make build
      - name: Build checksummed release-shaped artifacts
        run: |
          make dist VERSION=0.0.0-ci
          cd dist
          sha256sum --check SHA256SUMS

  docker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.8
          cache: true
      - name: Verify Docker
        run: docker info
      - name: Test Docker boundaries, adversarial chains, crash recovery and summaries
        env:
          GHOST_DOCKER_INTEGRATION: "1"
        run: |
          set -o pipefail
          go test ./internal/bench ./internal/runtime ./internal/session ./internal/cli -run Docker -count=1 -json | tee docker-integration.jsonl
          if grep -q '"Action":"skip"' docker-integration.jsonl; then
            echo "Required Docker integration tests must not skip"
            exit 1
          fi
      - name: Run complete GhostBench release gate
        run: |
          go build -o bin/ghost ./cmd/ghost
          ./bin/ghost bench
          ./bin/ghost bench --json
          ./bin/ghost bench --require-all --json
      - name: Verify normal user workflow
        run: |
          ghost_bin="$PWD/bin/ghost"
          project_dir="$(mktemp -d)"
          cd "$project_dir"
          "$ghost_bin" init
          "$ghost_bin" run -- sh -c 'printf "hello from ghost\n"; printf "safe build output\n" > generated.txt'
          test -s generated.txt
          "$ghost_bin" inspect latest
          "$ghost_bin" graph latest --json
          "$ghost_bin" incidents latest --json
      - name: Repeat rapid child OOM evidence regression
        env:
          GHOST_DOCKER_INTEGRATION: "1"
        run: go test ./internal/runtime -run '^TestDockerResourceChildOOMHasDaemonEvidence$' -count=10 -v
