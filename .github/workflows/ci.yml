name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.0
          cache: true
      - name: Verify module integrity
        run: |
          go mod verify
          go mod tidy -diff
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Build CLI
        run: go build ./cmd/ghost
      - name: Build checksummed release-shaped artifacts
        run: |
          make dist VERSION=0.0.0-ci
          cd dist
          sha256sum --check SHA256SUMS

  docker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.0
          cache: true
      - name: Verify Docker
        run: docker info
      - name: Test Docker isolation, Shadow evidence, and network boundary
        env:
          GHOST_DOCKER_INTEGRATION: "1"
        run: go test ./internal/bench ./internal/runtime ./internal/session -run Docker -v
      - name: Run complete GhostBench release gate
        run: |
          go build -o bin/ghost ./cmd/ghost
          ./bin/ghost bench --require-all --json
