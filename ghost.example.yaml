# Ghost project configuration schema version.
version: 1

runtime:
  # Docker is the only runtime provider implemented in v0.1.
  provider: docker

workspace:
  # Allowed values: read-write, read-only.
  mode: read-write

network:
  # Safe default. Use allowlist plus exact hostnames to enable HTTP/HTTPS.
  mode: deny
  # allow:
  #   - github.com
  #   - api.github.com

policy:
  # shadow exposes selected synthetic resources; deny leaves them absent.
  # Neither setting mounts or reads the host home directory.
  home: shadow

deception:
  # false means no decoys are exposed; it never exposes real host resources.
  enabled: true
  resources:
    aws_credentials: true
    ssh_private_key: true
    env_file: true

on_decoy_access:
  # Allowed severities: low, medium, high.
  severity: high
  record_incident: true
  # deny changes this session's network state to CONTAINED.
  # Use unchanged only when containment is deliberately disabled.
  network: deny
